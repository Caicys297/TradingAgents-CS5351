# Proposed `o5-perf` job for `.github/workflows/ci.yml` (F-owned file).

`.github/workflows/ci.yml` is F's shared CI file: A's PR #31 confirmation says E
and F align and **F lands the job** (or an attributed joint PR carries it). To
respect that ownership, this file is a reviewable patch only — it is **not** part
of the committed workflow and CI does not run it.

To enable the T17 gate, append the following job under `jobs:` in
`.github/workflows/ci.yml`:

```yaml
  o5-perf:
    name: o5 T17 performance (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T17 gate
        env:
          O5_T17_ENFORCE_THRESHOLD: "1"
        run: pytest -v test/offline/test_o5_macro_news_perf.py
```

Contract (implemented by `test/offline/test_o5_macro_news_perf.py`):

* `O5_T17_ENFORCE_THRESHOLD=1` ⇒ assert the platform is Linux and the interpreter
  is CPython 3.11, and fail if nearest-rank p95 exceeds 100 ms.
* Unset (every other matrix leg and the `America/New_York` include) ⇒ correctness
  is still asserted and timings are reported, but p95 is informational. The
  threshold is never applied outside the dedicated job, so no other leg can
  false-fail on a busy shared runner.
