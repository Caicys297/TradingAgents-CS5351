# A-selected consolidated development baseline. Earlier owner drafts remain review evidence.
registry_version: "1.0.0-a-baseline"
status: "selected_for_development; test and agent-plan approvals still required"
schema_target: "1.0.0"
development_contract:
  authority: "A-selected development baseline requested 2026-11-16; this file does not claim retroactive approval by B-F"
  approval_gate: "Each change still requires a versioned test-plan approval and coding-agent execution-plan approval before code generation; PR/CI approval follows implementation"
  approval_roles:
    O1_test_plan: "F reviews; A owns the feature"
    O2_test_plan: "A reviews"
    O3_test_plan: "F reviews"
    O4_test_plan: "F reviews"
    O5_test_plan: "F reviews"
    O6_test_plan: "A reviews"
    coding_agent_execution_plan: "A reviews each scoped plan before first code edit"
  integration_owner: "C is the sole editor/integrator of shared cli/run.py, trading_graph.py and rating-output wiring for O2/O4/O6; A coordinates and reviews; B/D/F provide isolated modules and tests"
  offline_tests: "All deterministic offline unit, subgraph and CLI tests live in test/offline and run in default pytest -q; reserve integration marker for tests requiring live services"
  o1:
    scope: "Yahoo/stockstats 50- and 200-session SMA only; other indicators and Alpha Vantage unchanged"
    numeric_tolerance: "absolute error <= 1e-6 before display formatting"
    insufficient_text: "N/A: insufficient history (needs {window} sessions, have {count})"
    date_rule: "sort cleaned dated closes for SMA-only calculation; reject duplicate dates with N/A: invalid price history (duplicate trading date); exclude dates after analysis date"
  o2:
    scope: "completed CLI runs only; programmatic and failed runs out of scope"
    run_dir: "<config[results_dir]>/<safe_ticker>/<analysis_date>/runs/<uuid4>/ reserved before graph execution; cli/run.py local results_dir already means the ticker/date directory"
    manifest_file: "manifest.json in the reserved run directory"
    write_failure: "analysis remains complete with O4 effective rating; visible manifest-failed warning; no provenance claim or partial file"
    fingerprint: "SHA-256 of UTF-8 canonical JSON over normalized identity + allowlisted effective settings; sorted keys, separators comma/colon, ensure_ascii=false, allow_nan=false, ISO analysis date, fixed Analyst order; exclude run ID, time, duration, output, artifact paths, secrets and vendor payloads"
    config_allowlist: ["llm_provider", "deep_think_provider", "deep_think_llm", "quick_think_provider", "quick_think_llm", "analysts", "max_debate_rounds", "max_risk_discuss_rounds", "max_tool_rounds", "output_language", "data_vendors", "tool_vendors", "news_article_limit", "global_news_article_limit", "global_news_lookback_days", "input_condensation_enabled", "input_budget_chars", "input_news_cap_chars", "input_stocktwits_cap_chars", "input_reddit_cap_chars", "input_near_dup_jaccard", "input_condensation_audit_note", "o5_rules_version", "o5_requested_topics", "o5_limit", "o4_gate_policy_version"]
    supported_ci_os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    artifact_stability: "ticker/date reports and logs shared_mutable unless per-run immutability is proven; manifest run_unique"
  o3:
    total_chars: 24000
    news_cap_chars: 12000
    stocktwits_cap_chars: 6000
    reddit_cap_chars: 6000
    near_duplicate_jaccard: 0.8
    first_duplicate_wins: true
    budget_exception: "use original affected block, record budget_exception, exclude from budget-pass calculations"
    token_claim: "character counts are not token counts; tokenizer counts are estimates unless provider usage is observed"
  o4:
    required_reports: "all selected Analysts; unselected reports not_required"
    report_presence: "non-empty text is present even if it mentions unavailable data; no whole-report sentinel in v1"
    rating_source: "final_rating first; parse final_trade_decision only if absent; clear disagreement -> REVIEW"
    checker_failure: "recoverable -> REVIEW with reason; invalid analyst configuration -> abort authoritative publication"
    publication: "buffer Portfolio Manager text in CLI; apply one shared gate before record_decision, report generation, return and final display; effective rating is authoritative"
    state_rule: "preserve final_trade_decision bytes; set final_rating and effective_rating to effective value on finalized state; retain original rating separately for diagnosis"
    policy_version: "o4-structural-v1"
  o5:
    scope: "already fetched Yahoo global-news candidates only; no new retrieval/LLM calls and no claim about unfetched topics"
    selector_module: "tradingagents/dataflows/macro_news_filter.py"
    shared_vendor: "private adapter in get_global_news_yfinance; preserve public str signature and ticker-news formatter"
    rules_version: "o5-rules-v1.1-draft"
    topic_order: ["MONETARY_POLICY", "INFLATION", "ECONOMIC_ACTIVITY"]
    matching_scope: "anchor and context in same title or summary field; clauses may differ within that field; no cross-field pairing"
    negation: "matched negated articles remain selectable as context and carry a negation flag"
    evidence_path: "same O2 run directory/o5_evidence.jsonl, when a CLI run context exists"
    sink_failure: "log SINK_FAILED and continue serving the honest result; do not claim persisted evidence"
    invariant_failure: "suppress selected articles and return an explicit filter-unavailable message, not no-news"
    zero_limit: "return LIMIT_ZERO without vendor fetch"
    dev20_fixture_sha256: "a6f65bf271d9c9ac555f5d9f81cde5cbdb4ff526f46772c065cfe2653f0231f6"
    dev20_oracle: "fixed provisional development fixture; not independent human label sign-off"
    rules:
      -
        id: "R1-MP"
        topic: "MONETARY_POLICY"
        anchors: ["federal reserve", "fed", "ecb", "bank of england", "boe", "bank of japan", "boj", "central bank", "monetary policy"]
        context: ["rate", "rates", "policy", "basis points", "hike", "hikes", "cut", "cuts", "unchanged", "holds", "held", "easing", "tightening", "normalization", "quantitative easing", "qe", "minutes"]
      -
        id: "R2-IN"
        topic: "INFLATION"
        anchors: ["inflation", "cpi", "consumer price index", "pce", "core pce", "disinflation", "deflation", "price pressure", "price pressures"]
        context: ["percent", "%", "year over year", "yoy", "falls", "fall", "rise", "rises", "rose", "holds", "held", "cools", "eases", "eased", "easing", "target", "sticky", "pressures"]
      -
        id: "R3-EA"
        topic: "ECONOMIC_ACTIVITY"
        anchors: ["gdp", "payrolls", "nonfarm payrolls", "unemployment", "jobless", "pmi", "recession", "retail sales", "industrial production", "manufacturing", "consumer spending"]
        context: ["percent", "%", "growth", "grows", "contract", "contraction", "expansion", "rose", "fell", "ticks up", "ticked up", "beats", "beating", "forecasts", "worries", "signals", "resilient", "slips"]
  o6:
    selected_scope: "ordinary and wrap_up calls of selected Analysts; first structured call deferred and disclosed"
    identity: "Graph Config metadata scope=analyst and agent_key=spec.key at Analyst subgraph boundary; never infer identity from callback order or node name"
    unattributed: "in-scope calls with missing/invalid key count as unattributed; known out-of-scope calls change neither named Analyst rows nor unattributed_calls; Analyst binding scope and scope-label semantics await A confirmation"
    legacy_api: "get_stats returns exactly the existing four keys and semantics"
requirements:
  - id: "REQ-O1-01"
    type: "functional_behavior"
    priority: "Must"
    statement: "On the Yahoo SMA path, a 50-session SMA is numeric only with at least 50 cleaned, non-missing dated closes through the reported date; with 1–49 usable closes return the exact insufficient-history text. An empty/no-close frame retains the existing no-market-data outcome."
    fit_criterion: "49 usable closes -> N/A: insufficient history (needs 50 sessions, have 49); 50 -> latest-50 dated-close mean with absolute error <= 1e-6 before display formatting; an all-missing-close frame yields NO_DATA_AVAILABLE through the routed tool."
    tradeoff: "Must. Without it, a short-history value can be labelled a 50-session SMA."
    status: "selected_for_development"
    source_review: "sources-v2.0/O1-SMA-Guard-Requirements-Latest.md#L23"
    verification: ["T-O1-01", "T-O1-02", "T-O1-03", "T-O1-05", "T-O1-06", "T-O1-09", "T-O1-10"]
    source_code: ["tradingagents/dataflows/vendors/yahoo/market.py", "tradingagents/dataflows/vendors/yahoo/snapshot.py"]
  - id: "REQ-O1-02"
    type: "functional_behavior"
    priority: "Must"
    statement: "On the Yahoo SMA path, a 200-session SMA is numeric only with at least 200 cleaned, non-missing dated closes through the reported date; with 1–199 usable closes return the exact insufficient-history text. An empty/no-close frame retains the existing no-market-data outcome."
    fit_criterion: "199 usable closes -> N/A: insufficient history (needs 200 sessions, have 199); 200 -> latest-200 dated-close mean with absolute error <= 1e-6 before display formatting; an all-missing-close frame yields NO_DATA_AVAILABLE through the routed tool."
    tradeoff: "Must. Without it, a short-history value can be labelled a 200-session SMA."
    status: "selected_for_development"
    source_review: "sources-v2.0/O1-SMA-Guard-Requirements-Latest.md#L24"
    verification: ["T-O1-01", "T-O1-02", "T-O1-03", "T-O1-05", "T-O1-06", "T-O1-09", "T-O1-10"]
    source_code: ["tradingagents/dataflows/vendors/yahoo/market.py", "tradingagents/dataflows/vendors/yahoo/snapshot.py"]
  - id: "REQ-O1-03"
    type: "invariant"
    priority: "Must"
    statement: "Count cleaned, non-missing closes separately for each reported date. Sort dated closes chronologically for the SMA-only calculation; exclude rows after the analysis date. A duplicate trading date is an invalid SMA input and must never produce a numeric SMA."
    fit_criterion: "At row/date 60 of a 260-date frame, 50-SMA is the latest-50 mean and 200-SMA is insufficient with count 60; shuffled unique-date input produces the same dated SMA values; duplicate-date input returns N/A: invalid price history (duplicate trading date)."
    metric: "Violations of the stated invariant in mapped acceptance cases"
    threshold: "0"
    tradeoff: "Must. A whole-frame count could make an early date look valid because later rows exist."
    status: "selected_for_development"
    source_review: "sources-v2.0/O1-SMA-Guard-Requirements-Latest.md#L25"
    verification: ["T-O1-04", "T-O1-11", "T-O1-12"]
    source_code: ["tradingagents/dataflows/vendors/yahoo/market.py", "tradingagents/dataflows/vendors/yahoo/snapshot.py"]
  - id: "REQ-O1-04"
    type: "functional_behavior"
    priority: "Must"
    statement: "When the yfinance/stockstats vendor serves the indicator (the shipped technical-indicators default, default_config.py:160), apply REQ-O1-01 and REQ-O1-02 on the bulk indicator path, the per-day fallback, and the verified snapshot. Alpha Vantage and any other configured indicator vendor remain outside O1."
    fit_criterion: "On the Yahoo path, each of the bulk, fallback, and snapshot entry points reports insufficient history for 49/199 sessions and a valid value at the corresponding 50/200 boundary."
    tradeoff: "Must. An unguarded Yahoo path would still send a misleading value to the analyst."
    status: "selected_for_development"
    source_review: "sources-v2.0/O1-SMA-Guard-Requirements-Latest.md#L26"
    verification: ["T-O1-01", "T-O1-02", "T-O1-03", "T-O1-05", "T-O1-06"]
    source_code: ["tradingagents/dataflows/vendors/yahoo/market.py", "tradingagents/dataflows/vendors/yahoo/snapshot.py"]
  - id: "REQ-O1-05"
    type: "invariant"
    priority: "Must"
    statement: "Leave non-SMA indicators' behavior unchanged."
    fit_criterion: "For a controlled frame, each selected non-SMA output equals the same-run direct stockstats reference; the prior regression suite has zero new failures."
    metric: "Violations of the stated invariant in mapped acceptance cases"
    threshold: "0"
    tradeoff: "Must. A broad guard could suppress unrelated indicators."
    status: "selected_for_development"
    source_review: "sources-v2.0/O1-SMA-Guard-Requirements-Latest.md#L27"
    verification: ["T-O1-07"]
    source_code: ["tradingagents/dataflows/vendors/yahoo/market.py", "tradingagents/dataflows/vendors/yahoo/snapshot.py"]
  - id: "REQ-O1-06"
    type: "quality_attribute"
    priority: "Must"
    statement: "Use an exact insufficient-history message distinct from the existing non-trading-day and no-market-data outcomes; duplicate dates use a separate invalid-history message."
    fit_criterion: "Exact insufficient-history text is N/A: insufficient history (needs W sessions, have N), with W and N replaced by integers. Duplicate dates yield N/A: invalid price history (duplicate trading date). A date absent from the cleaned loader output retains the existing non-trading-day text. No output test confuses these states."
    metric: "Ambiguous status comparisons in O1 output tests"
    threshold: "0"
    tradeoff: "Must. A generic N/A would hide the reason from the analyst."
    status: "selected_for_development"
    source_review: "sources-v2.0/O1-SMA-Guard-Requirements-Latest.md#L28"
    verification: ["T-O1-08", "T-O1-10", "T-O1-12"]
    source_code: ["tradingagents/dataflows/vendors/yahoo/market.py", "tradingagents/dataflows/vendors/yahoo/snapshot.py"]
  - id: "O2-FR-01"
    type: "functional_behavior"
    priority: "Must"
    statement: "For every completed CLI invocation, attempt one JSON provenance manifest. On success show its unique path; on write failure keep the analysis result but show a manifest-failed warning and do not claim saved provenance."
    fit_criterion: "Two successful same-ticker/date runs retain two readable manifests; an injected write failure leaves the gated analysis rating unchanged, visibly reports provenance unavailable and publishes no manifest path."
    tradeoff: "A completed analysis can lack a manifest after an explicit write failure; this avoids falsely claiming reproducibility or rolling back already persisted analysis artifacts."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L57"
    verification: ["O2-TC-01", "O2-TC-04", "O2-TC-13", "O2-TC-14"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-02"
    type: "functional_behavior"
    priority: "Must"
    statement: "Generate one collision-resistant invocation ID per run, distinguishing same-ticker/date and same-second invocations."
    fit_criterion: "Two same-ticker/date invocations retain two independently readable manifests. Two invocations in the same second have distinct IDs."
    tradeoff: "Adds ID generation/collision handling; does not preserve mutable artifact contents."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L58"
    verification: ["O2-TC-04", "O2-TC-11"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-03"
    type: "functional_behavior"
    priority: "Must"
    statement: "Reserve a unique run directory at <config[results_dir]>/<safe_ticker>/<analysis_date>/runs/<uuid4>/ and write manifest.json there without replacing a prior run directory or manifest."
    fit_criterion: "Two invocations with identical ticker/date and frozen second reserve distinct directories and retain byte-readable manifest.json files; an existing UUID collision is retried, never overwritten."
    tradeoff: "Adds one reserved directory and manifest per CLI invocation; avoids overwriting prior manifests."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L59"
    verification: ["O2-TC-04", "O2-TC-11"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-04"
    type: "functional_behavior"
    priority: "Must"
    statement: "Record normalized ticker, asset type, ISO analysis date and selected Analyst keys. Do not store the raw ticker separately."
    fit_criterion: "Manifest identity contains exactly the normalized four fields and no raw-ticker field."
    tradeoff: "Restricts identity to approved normalized fields; raw input may be omitted."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L60"
    verification: ["O2-TC-22"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-05"
    type: "security"
    priority: "Must"
    statement: "Serialize only the consolidated effective-configuration allowlist named in development_contract.o2_config_allowlist; omit absent values explicitly and never serialize a full config or environment."
    fit_criterion: "For a fixture containing every allowlisted field plus secrets and unknown fields, JSON contains the allowed non-secret fields with correct values and excludes every unlisted field and credential."
    metric: "Missing Git/model metadata is explicit, and available package/runtime values are recorded.; No unapproved config fields or secret values appear in manifest.; Only allowlisted config/model fields are serialized; unapproved keys are absent."
    threshold: "100% of the specified acceptance cases pass"
    tradeoff: "Less diagnostic detail than a full config dump."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L61"
    verification: ["O2-TC-06", "O2-TC-23"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-06"
    type: "functional_behavior"
    priority: "Must"
    statement: "Record package/runtime identity and Git commit/dirty state when available. Represent missing values explicitly; never fabricate them."
    fit_criterion: "Missing Git/model metadata is explicit, and available package/runtime values are recorded.; Package version, Python version, and platform are recorded when available."
    tradeoff: "Allows incomplete provenance when metadata is unavailable."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L62"
    verification: ["O2-TC-08", "O2-TC-09", "O2-TC-17", "O2-TC-24"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-07"
    type: "functional_behavior"
    priority: "Must"
    statement: "Compute SHA-256 over canonical UTF-8 JSON of normalized identity fields and the consolidated effective-configuration allowlist. Use sorted keys, no ASCII escaping, comma/colon separators, finite JSON numbers only, ISO analysis date and fixed Analyst order."
    fit_criterion: "Reordered mapping keys yield an identical 64-hex fingerprint; changing any included field changes it; excluded run ID/timestamp/artifact/output/payload fields do not; NaN/Infinity input is rejected."
    tradeoff: "Fingerprint covers selected fields/configuration, not vendor data."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L63"
    verification: ["O2-TC-02", "O2-TC-03", "O2-TC-12"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-08"
    type: "functional_behavior"
    priority: "Must"
    statement: "Exclude run ID, timestamps, duration, artifact paths, secrets, and market/news payloads from the deterministic fingerprint."
    fit_criterion: "Changing an included field changes the fingerprint; excluded fields do not.; Run ID and volatile timestamps do not affect deterministic fingerprint."
    tradeoff: "Improves stability but prevents data-level identity claims."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L64"
    verification: ["O2-TC-03", "O2-TC-12", "O2-TC-02"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-09"
    type: "functional_behavior"
    priority: "Must"
    statement: "If no immutable per-run market/news snapshot exists, record actual_input_data_provenance: not_captured; do not call the fingerprint a data hash."
    fit_criterion: "Without immutable snapshot, provenance is exactly not_captured; no data-hash/full-reproducibility claim."
    tradeoff: "Avoids overstating reproducibility; cannot reconstruct vendor payloads."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L65"
    verification: ["O2-TC-07"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-10"
    type: "functional_behavior"
    priority: "Must"
    statement: "Reference agreed artifacts using relative paths where possible and label each run_unique, shared_mutable, or not_persisted."
    fit_criterion: "Every artifact reference has the correct stability label."
    tradeoff: "Mutable links cannot preserve prior contents."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L66"
    verification: ["O2-TC-05"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-11"
    type: "security"
    priority: "Must"
    statement: "Exclude API keys, tokens, passwords, credential-bearing URLs, unrelated environment variables, and other secrets."
    fit_criterion: "No unapproved config fields or secret values appear in manifest."
    metric: "No unapproved config fields or secret values appear in manifest."
    threshold: "100% of the specified acceptance cases pass"
    tradeoff: "Protects credentials while reducing diagnostic detail."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L67"
    verification: ["O2-TC-06", "O2-TC-16", "O2-TC-23"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-12"
    type: "functional_behavior"
    priority: "Must"
    statement: "Include an agreed schema version and stable field names."
    fit_criterion: "In-scope completed invocation creates one valid manifest with required fields/schema version.; Manifest contains the agreed schema-version field and value."
    tradeoff: "Requires version and compatibility management."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L68"
    verification: ["O2-TC-01", "O2-TC-25"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-13"
    type: "functional_behavior"
    priority: "Must"
    statement: "Write valid JSON atomically, leaving no partial manifest after interruption/failure."
    fit_criterion: "Manifest JSON is first written to a temporary file inside its reserved run directory and atomically promoted to manifest.json; injected write/promotion failure leaves no partial manifest.json and a visible provenance-failed status."
    tradeoff: "Adds write-path care; does not itself choose fail-soft/closed behavior."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L69"
    verification: ["O2-TC-13", "O2-TC-14"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-FR-14"
    type: "functional_behavior"
    priority: "Must"
    statement: "A manifest-write failure is fail-soft for the gated analysis result but fail-closed for provenance claims: show a visible warning, leave no partial JSON, and do not publish a manifest path."
    fit_criterion: "On injected write failure, the O4 effective rating remains unchanged, CLI shows manifest failed, no partial manifest.json exists and no success path or full-provenance claim is shown."
    tradeoff: "The analysis can complete without a manifest, but the failure is visible and no provenance is claimed."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L70"
    verification: ["O2-TC-13", "O2-TC-14"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-NFR-01"
    type: "quality_attribute"
    priority: "Should"
    statement: "Use only the Python standard library for the manifest writer and fingerprint."
    fit_criterion: "Dependency diff for the O2 change contains zero new third-party runtime packages."
    metric: "New third-party runtime dependencies"
    threshold: "0"
    tradeoff: "May forgo convenient third-party libraries."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L76"
    verification: ["O2-TC-18"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-NFR-02"
    type: "quality_attribute"
    priority: "Should"
    statement: "Canonicalization is deterministic: sorted keys, stable separators, UTF-8, documented normalization."
    fit_criterion: "Same normalized included inputs/config yield identical fingerprint independent of key order."
    metric: "Canonicalization mismatches for equivalent mappings"
    threshold: "0"
    tradeoff: "Constrains serialization choices."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L77"
    verification: ["O2-TC-02", "O2-TC-10"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-NFR-03"
    type: "security"
    priority: "Must"
    statement: "Use an allowlist; serialized output contains no secrets."
    fit_criterion: "No unapproved config fields or secret values appear in manifest."
    metric: "Secret or unapproved configuration values in serialized output"
    threshold: "0"
    tradeoff: "Reduces diagnostic detail."
    status: "selected_for_development"
    source_review: "sources-v2.0/O2-Reproducibility-Manifest-Requirements.md#L78"
    verification: ["O2-TC-06", "O2-TC-16", "O2-TC-23"]
    source_code: ["cli/run.py", "tradingagents/graph/trading_graph.py"]
  - id: "O2-NFR-04"
    type: "quality_attribute"
    priority: "Should"
    statement: "Tests run offline without live vendors, market data, or LLM calls."
